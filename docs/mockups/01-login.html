<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>01 登录 · Sonar-CAD v2 Mockup</title>
<link rel="stylesheet" href="mockup.css">
</head>
<body>
<div class="login-wrap">
  <div>
    <div class="mock-banner" style="margin-bottom:16px;justify-content:center;">
      Mockup 01 / 09 · <a class="back" href="index.html">← 返回目录</a>
    </div>
    <div class="login-card">
      <div class="login-brand">
        <div class="lg">Sonar-CAD v2</div>
        <div class="sub">智能辅助声呐装备设计系统</div>
      </div>
      <div class="field">
        <label>用户名</label>
        <input class="input" value="admin" placeholder="用户名">
      </div>
      <div class="field">
        <label>密码</label>
        <input class="input" type="password" value="********" placeholder="密码">
      </div>
      <button class="btn primary" style="width:100%;justify-content:center;padding:8px 0;margin-top:4px;">登 录</button>
      <div class="help" style="text-align:center;margin-top:14px;">
        角色说明：admin（全部）/ designer（设计+知识写）/ reviewer（审阅裁决）/ viewer（只读）
      </div>
      <div class="help" style="text-align:center;border-top:1px solid var(--border);padding-top:12px;margin-top:12px;">
        登录后凭 JWT（12h）经网关访问，权限由 RBAC 控制
      </div>
    </div>
  </div>
</div>
</body>
</html>
