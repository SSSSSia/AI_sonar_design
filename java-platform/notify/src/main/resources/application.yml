server:
  port: 8084

spring:
  application:
    name: sonarcad-notify

# 与 gateway 共享同一 JWT 密钥（HS512）：WS 建连时校验 ?token= 的签名与有效期
jwt:
  secret: ${JWT_SECRET}

# ---- T10.1b（PHASE-010）：Prometheus 抓取端点（仅内网可达；网关无 /actuator 路由不外暴） ----
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: never
  prometheus:
    metrics:
      export:
        enabled: true
