server:
  port: 8082

spring:
  application:
    name: sonarcad-workflow
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:sonarcad}?stringtype=unspecified
    username: ${POSTGRES_USER:sonarcad}
    password: ${POSTGRES_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_AMQP_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:sonarcad}
    password: ${RABBITMQ_DEFAULT_PASS:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# py-engine 算力层（T2.3 知识回写同步调用；仅内网/本机）
py-engine:
  base-url: ${PY_ENGINE_BASE_URL:http://localhost:8090}

# notify 推送服务（T4.1 WS 进度；失败仅告警，推送是增强不是权威）
notify:
  base-url: ${NOTIFY_BASE_URL:http://localhost:8084}
