server:
  port: 8082

spring:
  application:
    name: sonarcad-workflow
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:sonarcad}?stringtype=unspecified
    username: ${POSTGRES_USER:sonarcad}
    password: ${POSTGRES_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_AMQP_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:sonarcad}
    password: ${RABBITMQ_DEFAULT_PASS:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
