### GraphRAG 配置文件 - 拖曳线列阵声呐 CAD 知识库
### 使用 SiliconFlow API

### LLM 设置 ###
completion_models:
  default_completion_model:
    type: litellm
    model_provider: openai
    auth_type: api_key
    api_key: ${SILICONFLOW_API_KEY}
    model: deepseek-ai/DeepSeek-V3.2
    api_base: https://api.siliconflow.cn/v1
    model_supports_json: true
    concurrent_requests: 100
    async_mode: threaded
    retry_strategy: exponential_backoff
    max_retries: 10
    tokens_per_minute: null
    requests_per_minute: null

embedding_models:
  default_embedding_model:
    type: litellm
    model_provider: openai
    auth_type: api_key
    api_key: ${SILICONFLOW_API_KEY}
    model: BAAI/bge-m3
    api_base: https://api.siliconflow.cn/v1
    concurrent_requests: 100
    async_mode: threaded
    retry_strategy: exponential_backoff
    max_retries: 10
    tokens_per_minute: null
    requests_per_minute: null

### 输入设置 ###
input:
  storage:
    type: file
    base_dir: "input"
  file_type: "text"
  file_encoding: "utf-8"

chunks:
  size: 800
  overlap: 150
  group_by_columns: [id]

### 输出/存储设置 ###
output:
  type: file
  base_dir: "output"

cache:
  type: json
  base_dir: "cache"

reporting:
  type: file
  base_dir: "logs"

vector_store:
  vector_size: 1024
  default_vector_store:
    type: lancedb
    db_uri: output/lancedb
    container_name: default

### 工作流设置 ###
embed_text:
  model_id: default_embedding_model
  vector_store_id: default_vector_store

extract_graph:
  model_id: default_completion_model
  prompt: "prompts/extract_graph.txt"
  entity_types: [SonarSystem, StructuralModule, Component, DesignParameter, PerformanceIndicator, DesignConstraint, Algorithm, CADModelingStandard]
  max_gleanings: 2

summarize_descriptions:
  model_id: default_completion_model
  prompt: "prompts/summarize_descriptions.txt"
  max_length: 500

extract_graph_nlp:
  text_analyzer:
    extractor_type: regex_english
  async_mode: threaded

cluster_graph:
  max_cluster_size: 8

extract_claims:
  enabled: true
  model_id: default_completion_model
  prompt: "prompts/extract_claims.txt"
  description: "提取设计断言、性能声明、验证结论"
  max_gleanings: 2

community_reports:
  model_id: default_completion_model
  graph_prompt: "prompts/community_report_graph.txt"
  text_prompt: "prompts/community_report_text.txt"
  max_length: 1500
  max_input_length: 5000

embed_graph:
  enabled: false

umap:
  enabled: false

snapshots:
  graphml: false
  embeddings: false

### 查询设置 ###
local_search:
  chat_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/local_search_system_prompt.txt"

global_search:
  chat_model_id: default_completion_model
  map_prompt: "prompts/global_search_map_system_prompt.txt"
  reduce_prompt: "prompts/global_search_reduce_system_prompt.txt"
  knowledge_prompt: "prompts/global_search_knowledge_system_prompt.txt"

drift_search:
  chat_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/drift_search_system_prompt.txt"
  reduce_prompt: "prompts/drift_reduce_prompt.txt"

basic_search:
  chat_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/basic_search_system_prompt.txt"
