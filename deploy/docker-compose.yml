# Sonar-CAD v2 数据底座（T0.2）
# 服务清单：PostgreSQL 17 / Neo4j 5 / Milvus(standalone+etcd) / MinIO / Redis 7.2 / RabbitMQ / Nginx
#
# 使用方式（在仓库根目录执行）：
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d
#   docker compose -f deploy/docker-compose.yml --env-file .env ps
#
# 注意：
# - MinIO 分桶（step-models / cad-scripts / design-docs / validation-reports / knowledge-dumps）
#   由应用启动时创建，不在本文件内。
# - Milvus standalone 依赖独立 etcd + 内部 MinIO（官方标准拓扑，不占用业务 MinIO 端口）。
# - MinIO 镜像说明：官方 minio/minio 已于 2026-02 从 Docker Hub 全量下架（社区版转 source-only）。
#   现用 Chainguard 官方二进制重构镜像（0 CVE），按 digest 固定；决策与备选方案见 docs/adr/ADR-002。
# - 国内网络拉取 Docker Hub 失败时两种解法：
#   a) Docker Desktop Settings → Docker Engine 配 registry-mirrors（推荐，一次配好全局生效）；
#   b) 在 .env 设 DOCKER_MIRROR=docker.m.daocloud.io/ 与 QUAY_MIRROR=quay.m.daocloud.io/
#      （变量带结尾斜杠，留空 = 直连官方源）。

name: sonarcad

networks:
  sonar-net:
    driver: bridge

volumes:
  pg-data:
  neo4j-data:
  redis-data:
  minio-data:
  etcd-data:
  milvus-minio-data:
  milvus-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:

services:
  # ---------- 业务库 ----------
  postgres:
    image: ${DOCKER_MIRROR:-}postgres:17-alpine
    container_name: sonar-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sonarcad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置}
      POSTGRES_DB: ${POSTGRES_DB:-sonarcad}
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sonarcad} -d ${POSTGRES_DB:-sonarcad}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [sonar-net]
    restart: unless-stopped

  # ---------- 知识图谱 ----------
  neo4j:
    image: ${DOCKER_MIRROR:-}neo4j:5-community
    container_name: sonar-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/change_me_in_env}
      # 内存按开发机可调；生产按 P3 §4.5 重新规划
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [sonar-net]
    restart: unless-stopped

  # ---------- 向量库：Milvus standalone（etcd + 内部 MinIO + milvus） ----------
  etcd:
    image: ${QUAY_MIRROR:-quay.io/}coreos/etcd:v3.5.14
    container_name: sonar-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks: [sonar-net]
    restart: unless-stopped

  # Chainguard 镜像以非 root(65532) 运行；旧卷数据由 root 写入，需一次性移交属主（幂等）
  minio-volume-init:
    image: cgr.dev/chainguard/minio@sha256:83b4a2d9f21bbf5127ef8b8bbe456d371cd35c8d03ec72262866ceee889c9a88
    container_name: sonar-minio-volume-init
    user: "0:0"
    entrypoint: ["/bin/bash", "-c"]
    command: ["chown -R 65532:65532 /data /minio_data"]
    volumes:
      - minio-data:/data
      - milvus-minio-data:/minio_data
    networks: [sonar-net]

  milvus-minio:
    # Chainguard 官方二进制重构，按 digest 固定版本（0 CVE，见 ADR-002）
    image: cgr.dev/chainguard/minio@sha256:83b4a2d9f21bbf5127ef8b8bbe456d371cd35c8d03ec72262866ceee889c9a88
    container_name: sonar-milvus-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    # 镜像 entrypoint 即 /usr/bin/minio，command 只传参数
    command: ["server", "/minio_data"]
    volumes:
      - milvus-minio-data:/minio_data
    depends_on:
      minio-volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/bin/mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks: [sonar-net]
    restart: unless-stopped

  milvus:
    image: ${DOCKER_MIRROR:-}milvusdb/milvus:v2.4.17
    container_name: sonar-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    ports:
      - "19530:19530"   # gRPC/SDK 接入
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [sonar-net]
    restart: unless-stopped

  # ---------- 文件存储（业务 MinIO，D-10 分桶） ----------
  minio:
    # Chainguard 官方二进制重构，按 digest 固定版本（0 CVE，见 ADR-002）
    image: cgr.dev/chainguard/minio@sha256:83b4a2d9f21bbf5127ef8b8bbe456d371cd35c8d03ec72262866ceee889c9a88
    container_name: sonar-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sonarcad}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请在 .env 中设置}
    # 上游已于 2025-06 移除 Web Console，不再映射 9001（MINIO_CONSOLE_PORT 保留仅作占位）
    command: ["server", "/data"]
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
    volumes:
      - minio-data:/data
    depends_on:
      minio-volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/bin/mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks: [sonar-net]
    restart: unless-stopped

  # ---------- 缓存 / 任务状态 / WS 频道 ----------
  redis:
    image: ${DOCKER_MIRROR:-}redis:7.2-alpine
    container_name: sonar-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?请在 .env 中设置} --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [sonar-net]
    restart: unless-stopped

  # ---------- 消息队列（D-06，失败任务进死信队列） ----------
  rabbitmq:
    image: ${DOCKER_MIRROR:-}rabbitmq:3.13-management-alpine
    container_name: sonar-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-sonarcad}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?请在 .env 中设置}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # T10.1c：原生 prometheus 插件（:15692/metrics，告警④队列深度数据源），免装 exporter
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./rabbitmq/conf.d-prometheus.conf:/etc/rabbitmq/conf.d/99-prometheus.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks: [sonar-net]
    restart: unless-stopped

  # ---------- 网关入口（D-03：Nginx + Spring Cloud Gateway） ----------
  # 骨架期：/api → gateway:8080，/ws → notify:8084；前端静态资源托管在阶段 4 接入。
  nginx:
    image: ${DOCKER_MIRROR:-}nginx:1.27-alpine
    container_name: sonar-nginx
    ports:
      - "80:80"
    extra_hosts:
      # Linux 兼容：容器内经 host.docker.internal 访问宿主机上的 gateway/notify
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      # 用 127.0.0.1 避免 busybox wget 解析 localhost 走 IPv6 被拒
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [sonar-net]
    restart: unless-stopped

  # ================= 应用层（T9.5，PHASE-009） =================
  # 默认 `docker compose up` 仍只起数据底座（开发模式 scripts/start-all 不受影响）；
  # 全栈：`cd deploy && docker compose --profile app up -d --build`
  # 监控（T10.1c，PHASE-010）：与 app 配套 `--profile monitoring up -d`
  # 压测 mock LLM（T10.2）：`--profile loadtest up -d mock-llm`
  # 干净克隆验收清单见 docs/phase/phase-9-稳定性与核心承诺补强.md §2.5

  gateway:
    image: sonarcad-java:0.3.0
    build: { context: .., dockerfile: deploy/docker/java.Dockerfile }
    container_name: sonarcad-gateway
    profiles: ["app"]
    restart: unless-stopped
    environment: &java-common-env
      SERVICE_JAR: gateway
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-sonarcad}
      POSTGRES_USER: ${POSTGRES_USER:-sonarcad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_AMQP_PORT: "5672"
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-sonarcad}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      AUTH_HOST: auth
      WORKFLOW_HOST: workflow
      BIZ_HOST: biz
      PY_ENGINE_HOST: py-api
      PY_ENGINE_BASE_URL: http://py-api:8090
      NOTIFY_BASE_URL: http://notify:8084
      NOTIFY_HOST: notify
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # T10.2 校准回调（PHASE-009 保守值无压测依据；.env 可覆盖，缺省=压测校准值）
      RL_AUTH_REPLENISH: ${RL_AUTH_REPLENISH:-10}
      RL_AUTH_BURST: ${RL_AUTH_BURST:-30}
      RL_WF_REPLENISH: ${RL_WF_REPLENISH:-150}
      RL_WF_BURST: ${RL_WF_BURST:-450}
      RL_PY_REPLENISH: ${RL_PY_REPLENISH:-100}
      RL_PY_BURST: ${RL_PY_BURST:-300}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      auth: { condition: service_started }
      workflow: { condition: service_started }
      biz: { condition: service_started }
      py-api: { condition: service_started }
    healthcheck:
      test: ["CMD", "bash", "-c", ": > /dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [sonar-net]

  auth:
    image: sonarcad-java:0.3.0
    container_name: sonarcad-auth
    profiles: ["app"]
    restart: unless-stopped
    environment:
      <<: *java-common-env
      SERVICE_JAR: auth
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "bash", "-c", ": > /dev/tcp/127.0.0.1/8081"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [sonar-net]

  workflow:
    image: sonarcad-java:0.3.0
    container_name: sonarcad-workflow
    profiles: ["app"]
    restart: unless-stopped
    environment:
      <<: *java-common-env
      SERVICE_JAR: workflow
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "bash", "-c", ": > /dev/tcp/127.0.0.1/8082"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [sonar-net]

  biz:
    image: sonarcad-java:0.3.0
    container_name: sonarcad-biz
    profiles: ["app"]
    restart: unless-stopped
    environment:
      <<: *java-common-env
      SERVICE_JAR: biz
    depends_on:
      postgres: { condition: service_healthy }
    # Flyway 迁移在 biz 启动时执行（V1–V12 + seed_rbac 的 admin/admin123）
    healthcheck:
      test: ["CMD", "bash", "-c", ": > /dev/tcp/127.0.0.1/8083"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [sonar-net]

  notify:
    image: sonarcad-java:0.3.0
    container_name: sonarcad-notify
    profiles: ["app"]
    restart: unless-stopped
    environment:
      <<: *java-common-env
      SERVICE_JAR: notify
    healthcheck:
      test: ["CMD", "bash", "-c", ": > /dev/tcp/127.0.0.1/8084"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [sonar-net]

  py-api:
    image: sonarcad-py:0.3.0
    build: { context: .., dockerfile: deploy/docker/py.Dockerfile }
    container_name: sonarcad-py-api
    profiles: ["app"]
    restart: unless-stopped
    environment: &py-common-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sonarcad}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sonarcad}
      CELERY_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER:-sonarcad}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
      WORKFLOW_BASE_URL: http://workflow:8082
      NOTIFY_BASE_URL: http://notify:8084
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_AUTH: ${NEO4J_AUTH}
      KB_MILVUS_URI: http://milvus:19530
      MINIO_ENDPOINT: minio:9000
      # presigned URL 交付宿主（插件/e2e）时的公开替换端点（19000=宿主映射端口）
      MINIO_PRESIGN_PUBLIC_ENDPOINT: ${MINIO_PRESIGN_PUBLIC_ENDPOINT:-http://localhost:19000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-300}
    ports:
      - "${PYAPI_PORT:-8090}:8090"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    # healthz 503（事件循环心跳滞后）→ Docker restart（T9.1 探针联动）
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=5)"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 40s
    networks: [sonar-net]

  py-worker:
    image: sonarcad-py:0.3.0
    container_name: sonarcad-py-worker
    profiles: ["app"]
    restart: unless-stopped
    command: ["python", "-m", "celery", "-A", "worker.celery_app", "worker", "--pool=solo", "-l", "info"]
    environment:
      <<: *py-common-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "timeout 15 python -m celery -A worker.celery_app inspect ping 2>/dev/null | grep -q pong || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 5
      start_period: 60s
    networks: [sonar-net]

  frontend:
    image: sonarcad-frontend:0.3.0
    build: { context: .., dockerfile: deploy/docker/frontend.Dockerfile }
    container_name: sonarcad-frontend
    profiles: ["app"]
    restart: unless-stopped
    ports:
      # 80 已被数据底座入口 nginx（host.docker.internal 形态）占用；全栈模式前端即入口
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      gateway: { condition: service_started }
      notify: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [sonar-net]

  # ================= 监控（T10.1c，PHASE-010；与 --profile app 配套） =================
  prometheus:
    image: ${DOCKER_MIRROR:-}prom/prometheus:v2.53.3
    container_name: sonarcad-prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [sonar-net]

  alertmanager:
    image: ${DOCKER_MIRROR:-}prom/alertmanager:v0.27.0
    container_name: sonarcad-alertmanager
    profiles: ["monitoring"]
    restart: unless-stopped
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [sonar-net]

  grafana:
    image: ${DOCKER_MIRROR:-}grafana/grafana:11.2.0
    container_name: sonarcad-grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3300}:3000"
    depends_on:
      prometheus: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [sonar-net]

  postgres-exporter:
    image: ${DOCKER_MIRROR:-}prometheuscommunity/postgres-exporter:v0.15.0
    container_name: sonarcad-pg-exporter
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-sonarcad}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sonarcad}?sslmode=disable
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9187/metrics"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks: [sonar-net]

  # ================= 压测 mock LLM（T10.2；容器栈指向 http://mock-llm:8091/v1） =================
  mock-llm:
    image: sonarcad-py:0.3.0
    build: { context: .., dockerfile: deploy/docker/py.Dockerfile }
    container_name: sonarcad-mock-llm
    profiles: ["loadtest"]
    restart: unless-stopped
    volumes:
      - ../py-engine/tests/e2e/mock_llm_server.py:/srv/mock_llm_server.py:ro
    command: ["python", "/srv/mock_llm_server.py"]
    environment:
      MOCK_LLM_HOST: 0.0.0.0
      MOCK_LLM_PORT: "8091"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/healthz', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [sonar-net]
