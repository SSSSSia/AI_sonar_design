# 首批 4 条核心告警（T10.1c；对齐总体设计 §10.5 与 PHASE-010 §2.1）。
# 口径注释即验收依据；触发证据见 docs/reviews/（任务书 §2.1 DoD）。
groups:
  - name: sonarcad-core
    rules:
      # ① Agent 任务软超时：>15 分钟完成任务占比 >10%（持续 2m）
      - alert: AgentTaskSoftTimeoutRatio
        expr: >
          sum(rate(py_agent_soft_timeout_total[10m]))
            / clamp_min(sum(rate(py_agent_task_total[10m])), 1e-9) > 0.1
        for: 2m
        labels:
          severity: warning
          team: sonarcad
        annotations:
          summary: "Agent 任务超 15 分钟占比超 10%"
          description: "近 10 分钟完成的 A1–A5 任务中，耗时 >15min 的占比超过阈值（总体设计 §10.5 告警①口径）"

      # ② CadQuery 沙箱执行失败率 >10%（含修复循环重跑，持续 2m）
      - alert: CadQueryFailureRateHigh
        expr: >
          sum(rate(py_cadquery_exec_total{outcome="fail"}[10m]))
            / clamp_min(sum(rate(py_cadquery_exec_total[10m])), 1e-9) > 0.1
        for: 2m
        labels:
          severity: warning
          team: sonarcad
        annotations:
          summary: "CadQuery 执行失败率超 10%"
          description: "沙箱执行（含修复循环）失败占比超阈值（总体设计 §10.5 告警②）"

      # ③ 检索延迟 P95 > 30s（持续 2m；按命中层级聚合）
      - alert: KbRetrievalLatencyP95High
        expr: >
          histogram_quantile(0.95,
            sum(rate(py_kb_query_duration_seconds_bucket[5m])) by (le)) > 30
        for: 2m
        labels:
          severity: warning
          team: sonarcad
        annotations:
          summary: "知识检索 P95 超 30s"
          description: "单条检索 P95（全层级）超过 30s（总体设计 §10.5 告警③）"

      # ④ Celery 任务队列积压：任一 sonarcad.* 队列深度 >100（持续 1m）
      - alert: CeleryQueueBacklog
        # 正则用字符类 [.]（双引号 YAML + PromQL 双层转义已实测踩坑）
        expr: max(rabbitmq_queue_messages{queue=~"sonarcad[.](a1|a2|a3|a4|a5|kb|echo)"}) > 100
        for: 1m
        labels:
          severity: warning
          team: sonarcad
        annotations:
          summary: "Celery 任务队列积压超 100"
          description: "RabbitMQ sonarcad.* 队列消息数 >100（总体设计 §10.5 告警④）"

      # ⑤ L1 缓存命中率 <60%（持续 10m；T12.8，§10.5 五条告警补齐）
      #    口径：hit/(hit+miss) 按全层聚合。两处健壮性（实测教训）：
      #    a) 无 hit 序列时 sum(...) 为空向量 → or vector(0) 兜底为 0（纯 miss 也能判 0%）；
      #    b) 最低流量门槛 >1e-3 op/s（≈10 分钟 6 次操作）——完全空转不误报。
      - alert: CacheHitRateLow
        expr: >
          ((sum(rate(py_cache_ops_total{result="hit"}[10m])) or vector(0))
            / clamp_min(sum(rate(py_cache_ops_total[10m])), 1e-9) < 0.6)
          and (sum(rate(py_cache_ops_total[10m])) > 1e-3)
        for: 10m
        labels:
          severity: warning
          team: sonarcad
        annotations:
          summary: "L1 缓存命中率低于 60%"
          description: "近 10 分钟 L1 缓存命中率 <60%（总体设计 §10.5 告警⑤）；命中率过低意味着 LLM/检索重复计费与延迟上升"
