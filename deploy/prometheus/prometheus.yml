# Prometheus 抓取配置（T10.1c，PHASE-010）。目标 = 容器化 app 栈（sonar-net 内部服务名）；
# 抓取间隔 15s（任务书 §2.1）。监控 profile 与 --profile app 配套使用（宿主开发栈无对应 DNS 名）。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: java-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway:8080"]

  - job_name: java-auth
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["auth:8081"]

  - job_name: java-workflow
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["workflow:8082"]

  - job_name: java-biz
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["biz:8083"]

  - job_name: java-notify
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notify:8084"]

  - job_name: py-api
    metrics_path: /metrics
    static_configs:
      - targets: ["py-api:8090"]

  - job_name: py-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["py-worker:9101"]

  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: postgres
    metrics_path: /metrics
    static_configs:
      - targets: ["postgres-exporter:9187"]
