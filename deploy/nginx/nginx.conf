# Sonar-CAD v2 Nginx 入口（骨架期）
# 生产形态：/ → 前端静态资源（阶段 4 接入）；/api → Spring Cloud Gateway；
# WebSocket 消息 schema 见 contracts/ws/。

upstream sonar_gateway {
    server host.docker.internal:8080;
}

upstream sonar_notify {
    server host.docker.internal:8084;
}

server {
    listen 80;
    server_name _;

    # 统一响应包与版本化路径见宪法 §5；网关未启动时返回 502 属预期
    location /api/ {
        proxy_pass http://sonar_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket 推送（任务进度/日志/审阅请求通知）
    location /ws/ {
        proxy_pass http://sonar_notify;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
