# T9.5（PHASE-009）前端容器版入口：与 nginx.conf 同构，但 upstream 是 compose 服务名
# （全栈模式网关/notify 是容器，不再需要 host.docker.internal）；另加 SPA 路由回退。

upstream sonar_gateway {
    server gateway:8080;
}

upstream sonar_notify {
    server notify:8084;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 统一响应包与版本化路径见宪法 §5；网关未启动时返回 502 属预期
    location /api/ {
        proxy_pass http://sonar_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 长轮询/上传放宽（cad-agent 长轮询 25s、文件上传 300s）
        proxy_read_timeout 3600s;
        client_max_body_size 100m;
    }

    # WebSocket 推送（任务进度/日志/审阅请求通知）
    location /ws/ {
        proxy_pass http://sonar_notify;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # SPA 前端路由回退（react-router 路径直开/刷新）
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
