# T13.2 promtail：docker_sd 发现容器并采集 stdout（经 docker.sock——Docker Desktop 可行性
# 已实测验证，见 docs/reviews/evidence/t132-loki-*）。Java/py 服务日志首行为 ISO 时间戳，
# 多行堆栈用 multiline 合并；标签保留 container/service/project 供 Grafana 过滤。
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: sonarcad-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'project'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
    pipeline_stages:
      - multiline:
          firstline: '^\d{4}-\d{2}-\d{2}[T ]'
          max_wait_time: 3s
          max_lines: 128
